async function validateSupervisorLink(params) {
    const token = params.get('token');
    if (!token) return true;
    const cloudRequired = params.get('cloud') === '1';
    if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
            const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data, error } = await client.from('supervisor_links').select('token').eq('token', token).eq('active', true).maybeSingle();
            if (cloudRequired || !error) return !error && Boolean(data);
        } catch (error) { return false; }
    }
    if (cloudRequired) return false;
    try {
        const links = JSON.parse(localStorage.getItem('supervisor_links') || '[]');
        return links.some(link => String(link.token || link.id) === token && link.active !== false);
    } catch (error) { return false; }
}

window.onload = async function() {
    const params = new URLSearchParams(window.location.search);
    cloudRequired = params.get('cloud') === '1';
    document.getElementById('supervisorPortalLink').href = 'supervisor.html' + (window.location.search || '');
    if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (error) {
            console.warn('Supabase initialization failed:', error);
        }
    }
    if (cloudRequired && !supabaseClient) {
        alert('Supabase is unavailable. Check your connection and reload this inspection.');
        window.location.replace('supervisor.html' + (window.location.search || ''));
        return;
    }
    if (!(await validateSupervisorLink(params))) {
        alert('This supervisor link is invalid or has been revoked.');
        window.location.replace('supervisor.html' + (window.location.search || ''));
        return;
    }
    const supervisorName = (params.get('name') || '').trim();
    const projectName = (params.get('project') || '').trim();
    branding = supabaseClient
        ? await SharedBranding.load(supabaseClient, branding)
        : SharedBranding.readLocal(branding);
    applyBranding();
    await fetchData();
    populateDropdowns();
    document.getElementById('inputInspectorName').value = supervisorName;
    if (projectName) {
        const matchingSite = sites.find(site => site.name === projectName);
        if (matchingSite) {
            document.getElementById('selectClient').value = matchingSite.clientId;
            handleClientChange();
            document.getElementById('selectSite').value = matchingSite.id;
        } else {
            const matchingClient = clients.find(client => client.name === projectName);
            if (matchingClient) {
                document.getElementById('selectClient').value = matchingClient.id;
                handleClientChange();
            }
        }
    }
    initializeQuestions();
    lucide.createIcons();
    initSignaturePad();
    updateSequentialLocks();
    document.getElementById('cloud-status').textContent = supabaseClient ? 'Cloud sync ready' : 'Local-only storage';
    document.getElementById('setup-modal').classList.add('open');
};

async function fetchData() {
    if (supabaseClient) {
        try {
            const { data: c, error: cErr } = await supabaseClient.from('clients').select('*');
            if (cErr) throw cErr;
            if(c && c.length > 0) { clients = c; localStorage.setItem('tw_clients', JSON.stringify(clients)); }

            const { data: s, error: sErr } = await supabaseClient.from('sites').select('*');
            if (sErr) throw sErr;
            if(s && s.length > 0) { sites = s; localStorage.setItem('tw_sites', JSON.stringify(sites)); }
        } catch(e) {
            console.warn("Cloud Sync Notice: " + e.message);
        }
    }
}

function initSignaturePad() {
    const c = document.getElementById('sigCanvas');
    const getPos = (e) => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    c.addEventListener('pointerdown', (e) => { e.preventDefault(); c.setPointerCapture(e.pointerId); sigDrawing = true; const p = getPos(e); const ctx = c.getContext('2d'); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    c.addEventListener('pointermove', (e) => { if (!sigDrawing) return; e.preventDefault(); const p = getPos(e); const ctx = c.getContext('2d'); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    ['pointerup', 'pointercancel'].forEach(ev => c.addEventListener(ev, () => { sigDrawing = false; }));
}
function sizeSigCanvas() {
    const c = document.getElementById('sigCanvas');
    const rect = c.getBoundingClientRect();
    c.width = rect.width; c.height = rect.height;
    const ctx = c.getContext('2d');
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f172a';
}
function openSigModal(mode) {
    sigMode = mode;
    document.getElementById('sigModalTitle').innerHTML = mode === 'auditor' ? '<i data-lucide="pen-line" class="w-5 h-5 text-amber-700"></i> TWS Signature' : '<i data-lucide="pen-line" class="w-5 h-5 text-amber-700"></i> Site Rep Signature';
    document.getElementById('sigModal').classList.remove('hidden'); document.getElementById('sigModal').classList.add('flex');

}
function closeSigModal() { document.getElementById('sigModal').classList.add('hidden'); document.getElementById('sigModal').classList.remove('flex'); document.body.style.overflow = ''; }
function clearSigCanvas() { const c = document.getElementById('sigCanvas'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function saveSignature() {
    const c = document.getElementById('sigCanvas');
    const ctx = c.getContext('2d');
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    let blank = true;
    for (let i = 3; i < data.length; i += 4) { if (data[i] !== 0) { blank = false; break; } }
    if (blank) { alert('Please draw the signature first.'); return; }
    const sig = c.toDataURL('image/png');
    if (sigMode === 'auditor') { auditorSignature = sig; document.getElementById('sigPreviewImg').src = sig; document.getElementById('sigPreviewBox').classList.remove('hidden'); document.getElementById('sigBtnText').innerText = '✓ Signature captured'; }
    else { repSignature = sig; document.getElementById('repSigPreviewImg').src = sig; document.getElementById('repSigPreviewBox').classList.remove('hidden'); document.getElementById('repSigBtnText').innerText = '✓ Signature captured'; }
    closeSigModal();
}

function renderTWQuestion(q, index, active) {
    const bubble = addAppBubble('');
    bubble.replaceChildren();
    const section = document.createElement('div');
    section.className = 'mb-1 text-[10px] font-bold uppercase text-[#128C7E]';
    section.textContent = `${q.topic} · ${q.type} · Question ${index + 1} of ${questionsList.length}`;
    bubble.appendChild(section);
    const prompt = document.createElement('p');
    prompt.className = 'font-semibold text-slate-800';
    prompt.textContent = q.text;
    bubble.appendChild(prompt);

    const explanation = q.explanation || q.details;
    if (explanation) {
        const explanationText = document.createElement('p');
        explanationText.className = 'mt-2 text-xs text-slate-600';
        explanationText.textContent = explanation;
        bubble.appendChild(explanationText);
    }

    if (q.photo && q.photo !== 'SKIP') {
        const photo = document.createElement('img');
        photo.src = q.photo;
        photo.alt = `Photo evidence for ${q.topic}`;
        photo.className = 'tw-photo-preview cursor-zoom-in';
        photo.addEventListener('click', () => openLightbox(q.photo));
        bubble.appendChild(photo);
    }

    const isFirstInTopic = index === 0 || questionsList[index - 1].topic !== q.topic;
    if (active && isFirstInTopic) {
        const topicActions = document.createElement('div');
        topicActions.className = 'chat-actions';
        topicActions.appendChild(createChatAction('Add Item', () => duplicateTopic(q.baseTopic, q.topic), 'secondary'));
        topicActions.appendChild(createChatAction('Mark Section N/A', () => markTopicNA(q.topic), 'secondary'));
        bubble.appendChild(topicActions);
    }

    if (active && !q.photo) {
        [['Take Photo (required)', true], ['Upload from Device', false]].forEach(([text, useCamera]) => {
            const fileLabel = document.createElement('label');
            fileLabel.className = 'tw-file-label';
            fileLabel.textContent = text;
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            if (useCamera) fileInput.capture = 'environment';
            fileInput.addEventListener('change', function() { compressAndStorePhoto(index, this); });
            fileLabel.appendChild(fileInput);
            bubble.appendChild(fileLabel);
        });
        const requirement = document.createElement('p');
        requirement.className = 'mt-2 text-[11px] text-slate-500';
        requirement.textContent = 'A photo is required before choosing Yes or No. Choose N/A instead if not applicable (a note is required).';
        bubble.appendChild(requirement);
    }

    if (active && !q.answer) {
        const answers = document.createElement('div');
        answers.className = 'chat-actions';
        [['Yes', ''], ['No', 'danger'], ['N/A', 'secondary']].forEach(([answer, style]) => {
            const button = createChatAction(answer, () => attemptSetAnswer(index, answer), style);
            button.disabled = !q.photo && answer !== 'N/A';
            answers.appendChild(button);
        });
        bubble.appendChild(answers);
        return;
    }

    if (q.answer) {
        addUserBubble(q.answer + (q.comment ? ` · ${q.comment}` : ''));
        if (active) {
            if (q.answer === 'No') {
                const label = document.createElement('label');
                label.className = 'mt-3 block text-xs font-bold text-slate-700';
                label.textContent = 'Risk urgency';
                const severity = document.createElement('select');
                severity.className = 'tw-select';
                severity.innerHTML = '<option value="48h">Minor defect · remediation required</option><option value="Red">Prohibition · stop work / high risk</option>';
                severity.value = q.severity;
                severity.addEventListener('change', () => setSeverity(index, severity.value));
                label.appendChild(severity);
                bubble.appendChild(label);
            }
            bubble.appendChild(createChatAction('Continue', continueTWQuestion));
        }
    }
}

function renderQuestions() {
    const container = document.getElementById('chat-container');
    container.replaceChildren();
    if (!inspectionStarted) return;

    const client = clients.find(item => String(item.id) === document.getElementById('selectClient').value);
    const site = sites.find(item => String(item.id) === document.getElementById('selectSite').value);
    addAppBubble(`Temporary Works inspection · ${site ? site.name : 'Site'} · ${document.getElementById('inputInspectorName').value.trim()}`);
    addAppBubble('Complete each section in order. Add the required photo before choosing Yes or No. For N/A, add a note instead.');

    for (let index = 0; index < Math.min(activeQuestionIndex, questionsList.length); index++) {
        renderTWQuestion(questionsList[index], index, false);
    }
    if (activeQuestionIndex >= questionsList.length) {
        renderTWFinalStep();
    } else {
        const currentQuestion = questionsList[activeQuestionIndex];
        renderTWQuestion(currentQuestion, activeQuestionIndex, true);
        const inputArea = document.getElementById('input-area');
        const textInput = document.getElementById('text-input');
        const showCommentInput = Boolean(currentQuestion.answer);
        inputArea.classList.toggle('hidden', !showCommentInput);
        textInput.value = currentQuestion.comment || '';
        textInput.placeholder = 'Add an observation (optional)';
    }
    lucide.createIcons();
    container.scrollTop = container.scrollHeight;
}

function escapeHtml(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function reindexQuestions() {
    questionsList.forEach((q, i) => { q.idx = i; });
}

function duplicateTopic(baseTopicStr, currentTopicStr, event) {
    if (event) { event.stopPropagation(); event.preventDefault(); }
    const ref = prompt("Inspect another item of this type? \n\nEnter location / bay reference (e.g. 'Bay 19', 'Gridline C'):");
    if (!ref) return;

    const templateQs = DEFAULT_QUESTIONS_TEMPLATE.filter(q => q.baseTopic === baseTopicStr);
    const newTopicName = `${baseTopicStr.replace(' (TW Item)', '')} - Ref: [${ref}]`;

    const newQs = templateQs.map((q, i) => ({
        id: 'q_dup_' + Date.now() + '_' + i,
        baseTopic: q.baseTopic,
        topic: newTopicName,
        type: q.type,
        text: q.text,
        answer: "",
        severity: "48h",
        comment: "",
        photo: "",
        idx: 0
    }));

    let insertIndex = questionsList.length;
    for (let i = questionsList.length - 1; i >= 0; i--) {
        if (questionsList[i].topic === currentTopicStr) {
            insertIndex = i + 1;
            break;
        }
    }

    questionsList.splice(insertIndex, 0, ...newQs);
    reindexQuestions();
    updateSequentialLocks();
    renderQuestions();
    addAppBubble(`Added another inspection section: ${newTopicName}`);
}

function markTopicNA(topicStr, event) {
    if (event) { event.stopPropagation(); event.preventDefault(); }
    const naNote = (prompt(`Mark "${topicStr}" as Not Applicable?\n\nA photo is not needed for N/A sections, but a note is required - explain why it does not apply:`) || '').trim();
    if (!naNote) { alert('A note is required to mark a section as N/A.'); return; }

    questionsList.forEach(q => {
        if (q.topic === topicStr) {
            q.answer = 'N/A';
            q.photo = 'SKIP';
            q.comment = 'Section N/A: ' + naNote;
        }
    });

    while (activeQuestionIndex < questionsList.length && questionsList[activeQuestionIndex].topic === topicStr) activeQuestionIndex++;
    updateSequentialLocks();
    renderQuestions();
}

function updateSequentialLocks() {
    maxUnlockedIndex = activeQuestionIndex;
}

function attemptSetAnswer(idx, val) {
    if (idx !== activeQuestionIndex) return;
    if (val === 'N/A') {
        const note = (prompt('Mark this question as Not Applicable.\n\nA note is required - explain why it does not apply:') || '').trim();
        if (!note) { alert('A note is required to mark a question as N/A.'); return; }
        if (!questionsList[idx].photo) questionsList[idx].photo = 'SKIP';
        questionsList[idx].comment = note;
        questionsList[idx].answer = val;
        renderQuestions();
        return;
    }
    if (!questionsList[idx].photo && questionsList[idx].photo !== 'SKIP') {
        alert("Rule Enforcement: A photo is mandatory for EVERY TW question before logging an answer. Please capture or upload a photo first.");
        return;
    }

    questionsList[idx].answer = val;
    renderQuestions();
}

function continueTWQuestion() {
    const question = questionsList[activeQuestionIndex];
    if (!question || !question.answer || (!question.photo && question.photo !== 'SKIP')) return;
    activeQuestionIndex++;
    updateSequentialLocks();
    renderQuestions();
}

function saveCurrentObservation() {
    const question = questionsList[activeQuestionIndex];
    const input = document.getElementById('text-input');
    if (!question || !question.answer || !input) return;
    const comment = input.value.trim();
    if (!comment) return;
    question.comment = comment;
    renderQuestions();
}

document.getElementById('send-btn').addEventListener('click', saveCurrentObservation);
document.getElementById('text-input').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        saveCurrentObservation();
    }
});

function setSeverity(idx, val) { questionsList[idx].severity = val; }
function setComment(idx, val) { questionsList[idx].comment = val; }

function compressAndStorePhoto(idx, input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                // Higher resolution constraint for crystal clear PDF evidence
                if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                questionsList[idx].photo = compressedDataUrl;
                updateSequentialLocks();
                renderQuestions();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightboxModal').classList.remove('hidden'); document.getElementById('lightboxModal').classList.add('flex'); }
function closeLightbox() { document.getElementById('lightboxModal').classList.add('hidden'); document.getElementById('lightboxModal').classList.remove('flex'); }

function addImageToPdf(doc, imageStr, x, y, width, height) {
    if (!imageStr || typeof imageStr !== 'string' || imageStr.indexOf('data:image') !== 0) return false;
    if (imageStr === 'SKIP') return false;
    try {
        let fmt = 'JPEG';
        if (imageStr.indexOf('image/png') !== -1) fmt = 'PNG';
        else if (imageStr.indexOf('image/webp') !== -1) fmt = 'WEBP';
        doc.addImage(imageStr, fmt, x, y, width, height);
        return true;
    } catch (err) { return false; }
}

function generatePdfBlob(audit, c, s) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const themeColor = branding.color || '#075E54';
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    function drawPageHeader() {
        doc.setFillColor(themeColor);
        doc.rect(0, 0, pageW, 28, 'F');
        const hasLogo = addImageToPdf(doc, branding.logoDataUrl || '', 12, 6, 28, 16);
        const textX = hasLogo ? 44 : 12;
        const maxW = pageW - 12 - textX;
        doc.setTextColor(branding.textColor || '#ffffff');
        let titleSize = 14;
        doc.setFont('helvetica', 'bold');
        const title = branding.title || 'Temporary Works Inspection UK';
        doc.setFontSize(titleSize);
        while (titleSize > 9 && doc.getTextWidth(title) > maxW) { titleSize -= 0.5; doc.setFontSize(titleSize); }
        doc.text(title, textX, 11);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        const info = doc.splitTextToSize(`Official Report | Project: ${c.name || 'N/A'} | Site: ${s.name || 'N/A'} | Date: ${audit.date}`, maxW).slice(0, 2);
        doc.text(info, textX, 17);
    }

    const tableRows = [];
    (audit.questions || []).forEach(q => {
        let result = q.answer === 'Yes' ? 'Compliant' : (q.answer === 'No' ? 'Defect' : 'N/A');
        let urgency = q.answer === 'No' ? (q.severity === 'Red' ? 'PROHIBITION' : 'MINOR') : '-';
        let findings = q.comment || 'No comment';

        tableRows.push([
            q.topic.replace(' (TW Item)', ''),
            q.text,
            result,
            urgency,
            findings,
            q.photo && q.photo !== 'SKIP' ? { content: '', image: q.photo } : 'No Photo'
        ]);
    });

    doc.autoTable({
        startY: 34,
        margin: { top: 34, left: 12, right: 12, bottom: 18 },
        head: [['Temporary Works Category', 'Criteria Checked', 'Result', 'Urgency', 'TWS Observations', 'Evidence Photo']],
        body: tableRows,
        headStyles: { fillColor: themeColor, fontSize: 8, fontStyle: 'bold' },
        styles: { fontSize: 7, cellPadding: 2.5, valign: 'middle', overflow: 'linebreak' },
        columnStyles: {
            0: { cellWidth: 30 },
            1: { cellWidth: 50 },
            2: { cellWidth: 18 },
            3: { cellWidth: 20 },
            4: { cellWidth: 42 },
            5: { cellWidth: 26, minCellHeight: 22 }
        },
        didDrawCell: function(data) {
            // Render crisp inline photo in table cell
            if (data.section === 'body' && data.column.index === 5 && data.cell.raw && typeof data.cell.raw === 'object' && data.cell.raw.image) {
                try {
                    let dim = 18;
                    doc.addImage(data.cell.raw.image, 'JPEG', data.cell.x + 4, data.cell.y + 2, dim, dim);
                } catch(e) {}
            }
        },
        didParseCell: function(data) {
            if (data.section === 'body' && data.column.index === 2) {
                if (data.cell.raw === 'Defect') { data.cell.styles.textColor = [220, 38, 38]; data.cell.styles.fontStyle = 'bold'; }
                if (data.cell.raw === 'Compliant') { data.cell.styles.textColor = [16, 185, 129]; }
            }
        },
        // Adds professional corporate header banner to every page automatically
        didDrawPage: drawPageHeader
    });

    // APPENDIX: Supervisor Summary & Signatures
    doc.addPage();
    drawPageHeader();
    let yPos = 40;
    doc.setTextColor(40, 40, 40);
    doc.setFontSize(11);
    doc.setFont("helvetica", "bold");
    doc.text("TWS Executive Summary & Declarations", 14, yPos);
    yPos += 8;

    doc.setFontSize(9); doc.setFont("helvetica", "normal");
    const notesSplit = doc.splitTextToSize((audit.inspectorNotes || "No summary provided."), 180);
    doc.text(notesSplit, 14, yPos);
    yPos += (notesSplit.length * 5) + 10;

    doc.setFontSize(10); doc.setFont("helvetica", "bold");
    doc.text("TWS Sign-Off (Field):", 14, yPos);
    doc.text("Site Rep Acknowledgement:", 110, yPos);
    yPos += 5;

    if (audit.auditorSignature) addImageToPdf(doc, audit.auditorSignature, 14, yPos, 55, 22);
    if (audit.siteRepSignature) addImageToPdf(doc, audit.siteRepSignature, 110, yPos, 55, 22);
    yPos += 26;

    doc.setDrawColor(60, 60, 60);
    doc.line(14, yPos, 78, yPos);
    doc.line(110, yPos, 174, yPos);
    yPos += 5;

    doc.setFontSize(8.5); doc.setFont("helvetica", "normal");
    doc.text('Name: ' + (audit.inspectorName || 'N/A') + ' (' + (audit.inspectorQuals || 'N/A') + ')', 14, yPos);
    doc.text('Name: ' + (audit.siteRepName || 'N/A'), 110, yPos);

    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        doc.setFontSize(7); doc.setFont('helvetica', 'normal'); doc.setTextColor(150, 150, 150);
        doc.text(doc.splitTextToSize(branding.footerText || 'Official Temporary Works Inspection Certificate.', pageW - 60)[0], 12, pageH - 9);
        doc.text(`Page ${i} of ${totalPages}`, pageW - 12, pageH - 9, { align: 'right' });
    }

    return doc.output('blob');
}

async function uploadPdfToSupabase(audit, pdfBlob) {
    if (!supabaseClient) throw new Error('Supabase is unavailable. Reload the app and try again.');
    const fileName = `TW_Report_${audit.id}_${audit.date}.pdf`;
    const filePath = `tw/${fileName}`;
    const uploadRequest = supabaseClient.storage
        .from('reports')
        .upload(filePath, pdfBlob, { contentType: 'application/pdf', upsert: true });
    const timeout = new Promise((resolve, reject) => setTimeout(() => reject(new Error('Supabase PDF upload timed out')), 30000));
    const { error } = await Promise.race([uploadRequest, timeout]);
    if (error) throw error;
    const { data: urlData } = supabaseClient.storage.from('reports').getPublicUrl(filePath);
    if (!urlData || !urlData.publicUrl) throw new Error('Supabase uploaded the report but did not return its public URL.');
    return urlData.publicUrl;
}

function downloadPdfBlob(pdfBlob, fileName) {
    const url = URL.createObjectURL(pdfBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function submitInspection() {
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Generating PDF & Saving Report...`;
    btn.disabled = true;
    await new Promise(resolve => setTimeout(resolve, 150));

    try {
        const clientId = document.getElementById('selectClient').value;
        const siteId = document.getElementById('selectSite').value;
        const inspectorName = document.getElementById('inputInspectorName').value.trim();
        const inspectorQuals = document.getElementById('inputInspectorQuals').value.trim();
        const inspectorNotes = document.getElementById('inputInspectorNotes').value.trim();

        if (!supabaseClient) {
            throw new Error('Supabase is unavailable. Reload the app and try again.');
        }
        if (!clientId || !siteId || !inspectorName || !inspectorQuals) {
            alert("⚠️ Missing Information: Please fill in Project, Site, TWS Name, and Qualifications.");
            return;
        }
        if (!auditorSignature) {
            alert("⚠️ TWS Signature required: please sign the document before submitting.");
            return;
        }

        const unanswered = questionsList.findIndex(q => !q.answer || (!q.photo && q.photo !== 'SKIP'));
        if (unanswered !== -1) {
            alert(`⚠️ Incomplete Inspection: You stopped at question ${unanswered + 1}. You must complete all questions in sequence and provide a photo for each before submitting.`);
            return;
        }

        let totalValid = 0; let yesCount = 0; let hasCritical = false;
        questionsList.forEach(q => {
            if (q.answer !== 'N/A') {
                totalValid++;
                if (q.answer === 'Yes') yesCount++;
                if (q.answer === 'No' && q.severity === 'Red') hasCritical = true;
            }
        });
        let score = totalValid > 0 ? Math.round((yesCount / totalValid) * 100) : 0;
        let finalStatus = (score === 100 && !hasCritical) ? "Closed" : "Open";

        const clientObj = clients.find(c => c.id === clientId) || { name: 'Project' };
        const siteObj = sites.find(s => s.id === siteId) || { name: 'Site' };

        const newAudit = {
            id: 'a_' + Date.now(),
            clientId,
            siteId,
            date: new Date().toISOString().split('T')[0],
            inspectorName,
            inspectorQuals,
            inspectorNotes,
            auditorSignature,
            siteRepName: document.getElementById('inputSiteRepName').value.trim(),
            siteRepSignature: repSignature,
            score,
            status: finalStatus,
            questions: questionsList,
            pdfUrl: ""
        };

        // Generate PDF Blob
        const pdfBlob = generatePdfBlob(newAudit, clientObj, siteObj);
        const fileName = `TW_Report_${newAudit.id}_${newAudit.date}.pdf`;
        downloadPdfBlob(pdfBlob, fileName);

        let existing = JSON.parse(localStorage.getItem('tw_audits')) || [];
        existing.push(newAudit);
        try {
            localStorage.setItem('tw_audits', JSON.stringify(existing));
        } catch(e) { console.warn("Local storage full, saving to cloud primary."); }

        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Supabase audit sync timed out')), 30000));
        const saveRequest = supabaseClient.from('audits').upsert([newAudit], { onConflict: 'id' }).select('id').single();
        const { data: savedAudit, error: saveError } = await Promise.race([saveRequest, timeout]);
        if (saveError) throw saveError;
        if (!savedAudit || String(savedAudit.id) !== String(newAudit.id)) {
            throw new Error('Supabase did not confirm that the inspection record was saved.');
        }

        const pdfUrl = await uploadPdfToSupabase(newAudit, pdfBlob);
        const linkTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Supabase PDF link save timed out')), 30000));
        const linkRequest = supabaseClient.from('audits').update({ pdfUrl }).eq('id', newAudit.id).select('id').single();
        const { data: linkedAudit, error: linkError } = await Promise.race([linkRequest, linkTimeout]);
        if (linkError) throw linkError;
        if (!linkedAudit || String(linkedAudit.id) !== String(newAudit.id)) {
            throw new Error('Supabase did not confirm that the report PDF was linked to the inspection.');
        }
        newAudit.pdfUrl = pdfUrl;
        const recordIndex = existing.findIndex(audit => audit.id === newAudit.id);
        if (recordIndex >= 0) existing[recordIndex] = newAudit;
        try { localStorage.setItem('tw_audits', JSON.stringify(existing)); }
        catch(e) { console.warn("Local storage full, saving to cloud primary."); }

        alert(`✅ Formal TW Report Submitted!\nCompliance Score: ${score}%\nInspection record and PDF saved to Supabase.`);
        window.location.href = 'officerdashboard.html';

    } catch (err) {
        alert(`❌ Submission Error: ${err.message}`);
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
    }
}
